name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 90 "https://ferramenta-integridade.onrender.com/api/health" -o /dev/null
